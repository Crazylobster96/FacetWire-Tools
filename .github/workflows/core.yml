name: Independent core verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Crazylobster96/FacetWire
          ref: 2b545b17cc370a074930577d2242981ff124d6b6
          path: work/facetwire-schema
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip install setuptools==80.9.0 wheel==0.45.1
      - run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - run: python tools/test-core.py --facetwire-schema-root work/facetwire-schema/spec/schema
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-${{ matrix.os }}-${{ matrix.python }}
          path: coverage/
          include-hidden-files: true
